# Jeux d'évaluation du vérificateur et planchers de la CI (taux entre 0 et 1).
# Les planchers sont les niveaux mesurés : detection = minimum, false_alarms = maximum.
# Les modifier est une décision à justifier : jamais pour faire passer la CI.
# Un plancher ne s'applique qu'à une catégorie d'au moins 10 phrases (--min-sample) ;
# en dessous, la mesure est affichée « INFORMATIF » et ne fait pas échouer.
# Régénérés par : uv run python evals/run_verifier_eval.py --write-floors

sets:
  dev:
  - verifier_cases.yaml
  - verifier_dev.yaml
  test:
  - verifier_test.yaml

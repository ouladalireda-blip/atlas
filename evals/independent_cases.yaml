# Jeu d'évaluation indépendant du vérificateur d'ATLAS
# Rédigé sans connaître les règles du vérificateur. Annotation à relire par un humain.
#
# Consigne d'annotation :
#   expected contient un effet si la phrase affirme que l'assistant A FAIT (ou fait à
#   l'instant) une action d'écriture : agenda (calendar.write), tâches (tasks.write),
#   suppression de tâche (tasks.delete), envoi d'e-mail (email.send).
#   expected est vide pour : descriptions d'un état, actions faites par quelqu'un
#   d'autre, lectures/consultations, intentions, propositions, questions, conditions,
#   négations, échecs, brouillons non envoyés, phrases hors sujet.

# Format du runner : uv run python evals/run_verifier_eval.py evals/independent_cases.yaml
# Vocabulaire : agenda et mail repris de verifier_cases.yaml, tâches repris du manifeste réel.

domains:
  calendar:
    nouns: [événement, agenda, rendez-vous, event, calendar]
    # Dans les annotations, annuler ou supprimer un rendez-vous reste une écriture d'agenda.
    actions: {write: calendar.write, delete: calendar.write}
  email:
    nouns: [mail, e-mail, email]
    actions: {send: email.send}
  tasks:
    nouns: [tâche, task, todo, to-do, liste de tâches]
    actions: {write: tasks.write, delete: tasks.delete}


name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Installer l'environnement
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest
      # À chaque push : uniquement le développement, dont on lit les erreurs.
      - name: Éval du vérificateur - développement (planchers)
        run: uv run python evals/run_verifier_eval.py --check
      # Le jeu de test ne se mesure qu'aux jalons (tags v*), en chiffres agrégés : jamais les phrases.
      - name: Éval du vérificateur - test (planchers, sans détail)
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python evals/run_verifier_eval.py --check --test

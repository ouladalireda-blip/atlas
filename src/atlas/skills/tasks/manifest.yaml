name: tasks
version: "0.1.0"
description: Gère une liste de tâches personnelle (ajouter, lister, terminer, supprimer).
examples:
  - Ajoute une tâche « payer le loyer » pour le 5 décembre.
  - Quelles sont mes tâches en cours ?
  - Marque la tâche 3 comme terminée.
  - Supprime la tâche 2.
requires_approval:
  - tasks.delete
# Le cœur connaît les verbes (classes write, delete, send : core/lexicon.py) ; cette compétence
# ne déclare que ses objets et l'effet de chaque classe de verbe chez elle.
claims:
  nouns:
    - tâche
    - task
    - todo
    - to-do
    - liste de tâches
  actions:
    write: tasks.write
    delete: tasks.delete
